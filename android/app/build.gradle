plugins {
    id 'com.android.application'
}

android {
    namespace 'com.givy.amfinder'
    compileSdk 35

    defaultConfig {
        applicationId "com.givy.amfinder"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    // Signing release dilakukan di CI lewat ilharp/sign-android-release
    // memakai keystore dari GitHub Secrets (KEYSTORE/KEY_ALIAS/dll),
    // jadi build lokal menghasilkan app-release-unsigned.apk.

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
}
