# Workflow CI/CD AM Finder APK v2.0
name: Build APK

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Timpa rilis dengan versi yang sama jika sudah ada (biarkan false agar rilis lama aman)"
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build AM Finder APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        run: |
          NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -n1)
          test -n "$NAME" || { echo "versionName tidak ditemukan"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Lindungi rilis yang sudah ada
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERWRITE: ${{ inputs.overwrite && 'true' || 'false' }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "Rilis $TAG sudah ada dan tidak akan ditimpa."
              echo "Naikkan versionName/versionCode, atau jalankan manual dengan overwrite=true."
              exit 1
            fi
            echo "overwrite=true: rilis $TAG akan ditimpa."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleRelease --warning-mode summary --stacktrace

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: android/app/build/outputs/apk/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: "35.0.0"

      - name: Rename APK
        run: |
          OUT="android/app/build/outputs/apk/release"
          SRC=$(find "$OUT" -maxdepth 1 \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) | head -n1)
          test -n "$SRC" || { echo "APK hasil sign tidak ditemukan"; exit 1; }
          mkdir -p dist
          cp "$SRC" "dist/amfinder-v${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "dist/amfinder.apk"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amfinder-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: AM Finder v${{ steps.ver.outputs.name }}
          files: dist/*.apk
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
