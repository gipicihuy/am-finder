name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build AM Finder APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleRelease --warning-mode summary --stacktrace

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: android/app/build/outputs/apk/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: "35.0.0"

      - name: Rename APK
        run: |
          OUT="android/app/build/outputs/apk/release"
          SRC=$(find "$OUT" -maxdepth 1 \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) | head -n1)
          test -n "$SRC" || { echo "APK hasil sign tidak ditemukan"; exit 1; }
          mkdir -p dist
          cp "$SRC" "dist/amfinder-v$(date +%Y%m%d).apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amfinder-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
